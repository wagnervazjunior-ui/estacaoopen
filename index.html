<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Estação Open — Inscrições, loja e informações do evento." />
  <meta property="og:title" content="Estação Open" />
  <meta property="og:description" content="Inscrições, loja e informações do evento." />
  <meta property="og:type" content="website" />
  <title>Estação Open</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #002766;
      --surface:   #005e90;
      --accent:    #bd9850;
      --accent-fg: #ffffff;
      --white:     #ffffff;
      --muted:     #7ea8c4;
      --green:     #25D366;
      --radius:    18px;
    }

    html, body {
      height: 100%;
      background: linear-gradient(160deg, #002766 0%, #004a80 60%, #005e90 100%);
      background-attachment: fixed;
      color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2.5rem 1.25rem 3rem;
    }

    .card {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Logo ─────────────────────────────────────── */
    .logo-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0.5rem 0;
    }

    .logo-wrap img {
      width: 100%;
      max-width: 240px;
      height: auto;
      display: block;
    }

    /* ── Tagline ──────────────────────────────────── */
    .tagline {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    /* ── Buttons ──────────────────────────────────── */
    .buttons {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 1rem 1.5rem;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover  { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .btn:active { transform: scale(0.97); opacity: 0.9; }

    /* Inscrições — accent */
    .btn-inscricoes {
      background: var(--accent);
      color: var(--accent-fg);
    }

    /* Loja — branco */
    .btn-loja {
      background: var(--white);
      color: #002766;
    }

    /* WhatsApp — verde */
    .btn-whatsapp {
      background: #25D366;
      color: var(--white);
    }

    /* ── SVG icons ────────────────────────────────── */
    .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* ── Footer ───────────────────────────────────── */
    footer {
      margin-top: 2.5rem;
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--white); }
  </style>
</head>
<body>

<div class="card">

  <div class="logo-wrap">
    <img src="logo.png" alt="Estação Open" />
  </div>

  <div class="buttons">

    <!-- INSCRIÇÕES — troque o href pelo link do OpenSync -->
    <a href="https://opensync.com.br/campeonatos/estacao-open-etapa-juquehy" class="btn btn-inscricoes" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Inscrições
    </a>

    <!-- LOJA VIRTUAL — troque o href pelo link da sua loja -->
    <a href="https://www.estacaoopenloja.com.br/" class="btn btn-loja" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
      Loja Virtual
    </a>

    <!-- WHATSAPP — troque pelo número com DDI -->
    <a href="https://wa.me/551137561400" class="btn btn-whatsapp" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
      </svg>
      WhatsApp
    </a>

  </div>

  <footer>
    <p>© 2025 Estação Open · Todos os direitos reservados</p>
    <p style="margin-top:0.25rem">Powered by <a href="https://opensync.com.br" target="_blank">OpenSync</a></p>
  </footer>

</div>

</body>
</html>

    *, *::before, *::after { box-sizing:dding: 0; }

    :root {
      --bg:        #002766;
      --surface:   #005e90;
      --accent:    #bd9850;
      --accent-fg: #ffffff;
      --white:     #ffffff;
      --muted:     #7ea8c4;
      --green:     #25D366;
      --radius:    18px;
    }

    html, body {
      height: 100%;
      background: linear-gradient(160deg, #002766 0%, #004a80 60%, #005e90 100%);
      background-attachment: fixed;

      -webkit-font-smoothing: antialiased;

    body {

      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2.5rem 1.25rem 3rem;
    }

    .card {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Logo ─────────────────────────
    .logo-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0.5rem 0;
    }

    .logo-wrap img {
      width: 100%;
      max-width: 240px;
      height: auto;
      display: block;
    }

    /* ── Tagline ──────────────────────────────────── */
    .tagline {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    /* ── Buttons ──────────────────────
    .buttons {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 1rem 1.5rem;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.12s ease, city 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover  { transform: translateY(4px rgba(0,0,0,0.4); }
    .btn:active { transform: scale(0.97); opacity: 0.9; }

    /* Inscrições — accent */
    .btn-inscricoes {
      background: var(--accent);
      color: var(--accent-fg);
    }

    /* Loja — branco */
    .btn-loja {
      background: var(--white);
      color: #002766;
    }

    /* WhatsApp — verde */
    .btn-whatsapp {
      background: #25D366;
      color: var(--white);
    }
